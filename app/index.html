<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <!-- **قرصةُ الطفل حرة** (بلاغ الميدان الثاني، ١١ أغسطس ٢٠٢٦ — نقضَ قفلَ المقياس):
       الطفل يكبّر الصفحةَ ليرى التشكيلَ جيداً، وكان ذلك مريحاً تلقائياً — فقفلُ
       maximum-scale/user-scalable كان تحويطاً أوسعَ من عيبه فرُدّ. يبقى من العلاج:
       العودةُ من الخلفية تُرجِع المقياسَ ١ برمجياً (main.js — عيبُ استرجاع iPadOS
       وبقايا تكبيرِ جلسةٍ سابقة معاً)، وتكبيرُ النقر المزدوج العارض ساقطٌ باللوح
       (touch-action: manipulation) والقرصةُ المتعمَّدة لا يمسّها. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="اِقْرَأْ — يعلّم طفلك قراءة العربية، من الحرف الأول إلى القرآن">
  <meta name="theme-color" content="#FAF4E8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A241C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="اقرأ">
  <title>اِقْرَأْ — تعلّم القراءة العربية</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app" aria-live="polite">
    <p class="boot">يُحمَّل التطبيق…</p>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="boot">هذا التطبيق يحتاج تفعيل جافاسكربت في المتصفّح.</p>
  </noscript>

  <script type="module" src="js/main.js"></script>

  <!-- **حارسُ الإقلاع** (بلاغ ميدان المالك، ١٧ أغسطس ٢٠٢٦): علق سفاري على شاشة
       «يُحمَّل التطبيق…» بعد تحديثاتٍ متكررة — عاملُ خدمةٍ في حالٍ وسط، والمثبَّتُ
       وكرومُ يعملان. فلا يُترك والدٌ أمام صفحةٍ صامتة: إن لم يقلع التطبيقُ في
       ثماني ثوانٍ ظهر زرٌّ واحد يُصلح بنفسه — **يُلغي تسجيلَ العامل ويمسح قشرته
       وحدَها** (`muallim-shell-*`) ثم يعيد التحميل. **ومخزنُ الصوت لا يُمَسّ**
       (٤١ ميغابايت لا تُنزَّل مرّتين)، ولا يُمسّ تقدّمُ الطفل (في `localStorage`).
       سطرٌ واحد بلا وحدةٍ ولا استيراد — كي يعمل ولو سقط بناءُ الوحدات كلُّه. -->
  <script>
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || !app.querySelector('.boot')) return;
      var btn = document.createElement('button');
      btn.className = 'btn btn--primary btn--wide';
      btn.textContent = 'أصلِح وأعِد المحاولة';
      btn.onclick = function () {
        btn.disabled = true;
        btn.textContent = 'يُصلَح…';
        var done = function () { location.reload(); };
        var jobs = [];
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k.indexOf('muallim-shell-') === 0; })
              .map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).then(done, done);
      };
      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = 'تأخّر فتحُ التطبيق. اضغط الزرّ — لا يُمسّ تقدّمُ طفلك ولا الأصواتُ المخزونة.';
      app.append(note, btn);
    }, 8000);
  </script>
</body>
</html>
