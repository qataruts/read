<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>لقطات خطوات الدرس</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    .cell { background: rgba(255,255,255,.35); border-radius: 24px; padding: .5rem; }
    .cell > h4 { margin: .2rem 0 .4rem; text-align: center; color: #b8720a; }
    .app { max-width: none; padding: 0; }
    .dev { display: none; }   /* أدوات التجربة تُستعمل للقيادة فقط ولا تدخل اللقطة */
  </style>
</head>
<body>
<div id="toast" class="toast" hidden></div>
<div class="grid" id="grid"></div>
<script type="module">
import { renderLesson, harakaRounds } from './js/lesson.js';
import { HARAKAT } from './js/curriculum.js';

// صوتٌ لا ينتهي أبداً (نمطُ عدّة الجهاز): تتجمّد الحالُ المعروضة، والقناةُ تعدّه
// متعذّراً فتصفو فوراً — فلا تتكدّس نقراتُ القيادة أصواتاً تُعلّق `afterSpeech`.
window.Audio = class { play() { return new Promise(() => {}); } pause() {} };
// **والزمنُ مُسرَّع**: المشغّل يلتقط لقطةً واحدة عند سكون التحميل، وخطوةُ الحركات
// تنتقل بمهلة ٧٥٠ منذ ع٢ — فتُصفَّر مُهَلُ المؤقّتات (بترتيبها) كي تكتمل الوضعيةُ
// قبل لحظة الالتقاط. صفحةُ عرضٍ تُصوَّر، لا حارسَ يقيس تعاقباً.
const realSetTimeout = window.setTimeout.bind(window);
window.setTimeout = (fn, _ms, ...args) => realSetTimeout(fn, 0, ...args);

const grid = document.getElementById('grid');
const $$ = (root, sel) => [...root.querySelectorAll(sel)];

// **القيادةُ غيرُ متزامنة منذ ع٢** (تصحيحُ المدير، ٢٢ أغسطس ٢٠٢٦ — نمطُ ع٤ في
// `browser_device.html`): خطوةُ الحركات ثلاثةُ أسئلةٍ تنتقل بعد سكوت القناة
// ومهلة العين، فتُقاد جولةً جولة بعددٍ مشتقٍّ من `harakaRounds` لا بنقرةٍ واحدة —
// وكانت الصفحةُ على شكل ما قبل ع٢ فتنهار على `.next` معدوماً.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, label, ms = 8000) {
  const t0 = Date.now();
  for (;;) {
    let v; try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - t0 > ms) throw new Error('انتظار طويل: ' + label);
    await sleep(20);
  }
}
async function solveHarakat(app) {
  $$(app, '.btn').find((b) => b.textContent.includes('أيها سمعت')).click();
  const rounds = harakaRounds(HARAKAT).length;
  for (let r = 1; r <= rounds; r++) {
    await until(() => $$(app, '.vchip').length
      && !$$(app, '.vchip').some((c) => c.classList.contains('good')),
    `فتحُ جولة الحركات ${r} من ${rounds}`);
    $$(app, '.vchip').forEach((c) => c.click());
  }
  return until(() => app.querySelector('.next'), 'زرُّ «تابع» بعد الجولات');
}
const queue = [];
function instance(title, drive) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = `<h4>${title}</h4>`;
  const app = document.createElement('div');
  app.className = 'app';
  app.append(renderLesson('g1', 'ب'));
  cell.append(app);
  grid.append(cell);
  queue.push(() => drive(app));
}

instance('١ — اسمع وشاهد', () => {});
instance('٢ — الحركات (بعد السؤال)', (app) => {
  app.querySelector('.next').click();
  $$(app, '.btn').find((b) => b.textContent.includes('أيها سمعت')).click();
  const chips = $$(app, '.vchip');
  chips[0].classList.add('good');
  chips[2].classList.add('bad');
});
instance('٣ — تتبّع', async (app) => {
  app.querySelector('.next').click();
  (await solveHarakat(app)).click();
});
instance('٤ — ميّز بأذنك', async (app) => {
  app.querySelector('.next').click();
  (await solveHarakat(app)).click();                    // ← تتبّع
  $$(app, '.btn').find((b) => b.textContent.includes('تمّ')).click();
});
instance('٥ — الاحتفال', (app) => {
  $$(app, '.btn').find((b) => b.textContent.includes('إنهاء الدرس')).click();
});

for (const drive of queue) await drive();
</script>
</body>
</html>
