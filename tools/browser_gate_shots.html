<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>لقطات بوابتَي الإتقان</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    .cell { background: rgba(255,255,255,.35); border-radius: 24px; padding: .5rem; }
    .cell > h4 { margin: .2rem 0 .4rem; text-align: center; color: #b8720a; }
    .app { max-width: none; padding: 0; }
    .dev { display: none; }   /* أدوات التجربة تُستعمل للقيادة فقط ولا تدخل اللقطة */
  </style>
</head>
<body>
<div id="toast" class="toast" hidden></div>
<div class="grid" id="grid"></div>

<script>
// عطبٌ في صفحة اللقطات يُكتب في الصفحة نفسها — فاللقطة البيضاء الصامتة تحيّر
const shout = (what) => {
  const box = document.createElement('pre');
  box.style.cssText = 'color:#b00;font:14px/1.6 monospace;white-space:pre-wrap';
  box.textContent = 'عطب: ' + what;
  document.body.prepend(box);
};
window.addEventListener('error', (e) => shout(e.message));
window.addEventListener('unhandledrejection', (e) => shout(e.reason?.stack || e.reason));
</script>

<!-- تقدّم مزروع قبل تحميل الوحدات: طفلٌ بلغ بوابة المصحف وفي سجلّه ضعيفٌ وقويّ -->
<script>
  const now = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const skill = (right, wrong, box, due) => ({ right, wrong, box, due: now + due, seen: now });
  localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 2,
    stars: {},   // تُملأ من بنية الرحلة أدناه (كل ما قبل البوابة)
    skills: {
      'ك|fatha|quiz': skill(1, 4, 0, 0),
      'ق|kasra|quiz': skill(0, 3, 0, 0),
      'ط|damma|haraka': skill(2, 3, 0, 0),
      'ص|fatha|quiz': skill(1, 2, 0, 0),
      'ض|fatha|haraka': skill(3, 1, 1, 1),
      'ظ|kasra|quiz': skill(4, 0, 4, 8),
    },
    days: {}, reviews: {}, records: [], mic: false, seconds: 30 * 60,
    startedAt: Date.now(), updatedAt: Date.now(),
  }));
</script>

<script type="module">
import { renderGate } from './js/gate.js';
import * as progress from './js/progress.js';
import * as audio from './js/audio.js';

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/** تفريغ المهامّ الدقيقة: `audio.play` تنتظر الفهرس، فلا يُعرَف المسموع قبل تفريغها. */
const flush = async () => { for (let i = 0; i < 12; i++) await Promise.resolve(); };

// صوت لا ينتهي أبداً (تُجمَّد الحالة المعروضة)، **ويسجّل نصّ ما شُغِّل** كي نعرف الهدف
// المسموع فنقود الجلسة إلى عبورٍ حقيقيّ لا إلى نقرةٍ عمياء.
const manifest = await (await fetch('audio/manifest.json')).json();
let heard = '';
window.Audio = class {
  constructor(src = '') {
    heard = manifest[(src.split('/').pop() || '').split('?')[0].replace('.mp3', '')] ?? '';
  }
  play() { return new Promise(() => {}); }
  pause() {}
};

const grid = document.getElementById('grid');
const $$ = (root, sel) => [...root.querySelectorAll(sel)];

function cell(title, node) {
  const box = document.createElement('div');
  box.className = 'cell';
  box.innerHTML = `<h4>${title}</h4>`;
  const app = document.createElement('div');
  app.className = 'app';
  app.append(node);
  box.append(app);
  grid.append(box);
  return app;
}

// طفلٌ أتمّ الرحلة حتى بوابة المصحف (لم يعبرها بعد)
for (const node of progress.allNodes()) {
  if (node.id === 'gate:quran') break;
  progress.setStars(node.id, 3);
}

const finish = (app) =>
  $$(app, '.dev .btn').find((b) => b.textContent.includes('إنهاء الجلسة'))?.click();
const chipOf = (app, text) =>
  $$(app, '.vchip').find((c) => c.querySelector('.vchip-face').textContent === text);

// **مؤقّتات فورية أثناء القيادة**: الجلسة تُسمِع هدفها بعد ٢٥٠ م.ث وتنتقل بعد الصواب
// بـ٧٥٠، ولو انتظرناها بـ`await` لالتُقطت اللقطة في منتصف البناء. فتُنفَّذ مؤقّتاتُ
// القيادة في حينها — فتُبنى اللقطات كلها قبل أي تنازل عن الخيط — ثم تُردّ كما كانت.
const realTimeout = window.setTimeout;
window.setTimeout = (fn, ms) => (typeof fn === 'function' ? (fn(), 0) : realTimeout(fn, ms));

await audio.ready();                                     // الفهرس محمَّلٌ قبل أول تشغيل

// ١) أول تمرين في البوابة (الأضعف أولاً)
cell('١ — بوابة المصحف: أول تمارينها', renderGate('quran'));

// ٢) حكم الإخفاق: «ليس بعدُ» — لا رسوب ولا عقاب. تُقاد بخطأين على الهدف المسموع.
const failed = cell('٢ — «ليس بعدُ» (دون ٨٠٪)', renderGate('quran'));
await flush();
const failTarget = chipOf(failed, heard);
for (const chip of $$(failed, '.vchip')) if (chip !== failTarget) chip.click();
finish(failed);

// ٣) حكم العبور: نجومٌ وفتحُ ما بعدها — تُقاد بإصابةٍ على الهدف المسموع نفسه
const opened = cell('٣ — «فُتحت البوابة» (بعد العبور)', renderGate('quran'));
await flush();
chipOf(opened, heard)?.click();                          // ينتقل فوراً إلى التمرين التالي
finish(opened);

window.setTimeout = realTimeout;                         // ثم تعود المؤقّتات إلى طبعها

// ٤) الخريطة: محطة البوابة قبل المرحلة القرآنية
// (لا تتبُّعَ للعقدة التالية هنا: تمريرُ الصفحة يزيح اللقطة عن مكانها — كما في لقطات البساتين)
Element.prototype.scrollIntoView = () => {};
const map = cell('٤ — الخريطة: البوابة بعد اجتيازها', document.createElement('div'));
map.id = 'app';
await import('./js/main.js');   // يرسم الخريطة في #app (لا مسار في الرابط ⇒ الخريطة)

// الخريطة كلها لا تُلتقط في لقطة: نُبقي رأسها وبطاقة «تابع» ومحطة البوابة وجارتيها
const track = map.querySelector('.map');
if (track) {
  const kids = [...track.children];
  const at = kids.findIndex((el) => el.classList.contains('station--gate'));
  track.replaceChildren(
    ...kids.filter((el) => el.classList.contains('continue')),
    ...kids.slice(Math.max(0, at - 2), at + 3),
  );
}

// مهلةٌ قبل حدث التحميل: بها يتخطّط المبنيّ حديثاً ويُرسَم قبل التقاط اللقطة
// (اللقطة تُؤخَذ عند `load`، وانتظارُ الوحدة يؤخّره).
await sleep(600);
</script>
</body>
</html>
