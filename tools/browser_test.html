<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>اختبار درس الحرف</title></head>
<body>
<pre id="out" style="font:14px/1.6 monospace"></pre>
<iframe id="frame" src="index.html" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script type="module">
const out = document.getElementById('out');
const results = [];
const post = () => navigator.sendBeacon('/result?from=read',
  new Blob([JSON.stringify(results, null, 1)], { type: 'text/plain' }));
const ok = (cond, msg) => {
  results.push({ ok: !!cond, msg });
  out.textContent += `${cond ? '✓' : '✗'} ${msg}\n`;
  post();                        // نتيجة جزئية بعد كل تحقّق كي لا يضيع التقرير عند التعليق
};
setTimeout(() => { ok(false, 'انتهت المهلة الكلية'); post(); }, 60000);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, label = '', ms = 4000) {
  const t0 = Date.now();
  for (;;) {
    let v; try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - t0 > ms) throw new Error('انتظار طويل: ' + label);
    await sleep(30);
  }
}

const { HARAKAT } = await import('./js/curriculum.js');   // بيانات المنهج مصدرها الوحيد
const manifest = await (await fetch('audio/manifest.json')).json();
// النصوص المنتظِرة في قائمة الانتظار الصوتية: لا ملف لها بعدُ، فاحتياط النطق الآلي
// هو الصواب مؤقتاً — وتفرغ القائمة بعد التصريف فيعود الفحص صارماً بلا تعديل هنا.
const pendingAudio = new Set(await (await fetch('/__queue.json')).json());
const frame = document.getElementById('frame');

const played = [];      // نصوص شُغِّلت من الملفات المولَّدة
const spoken = [];      // ما لجأ إلى النطق الآلي (يجب أن يبقى فارغاً)
const jsErrors = [];
let win, doc;

/** يربط الأدوات بنافذة الإطار الحالية ويعزل الصوت عن فكّ الترميز. */
function attach() {
  win = frame.contentWindow;
  doc = frame.contentDocument;
  win.addEventListener('error', (e) => jsErrors.push(String(e.message)));
  win.addEventListener('unhandledrejection', (e) => jsErrors.push('رفض غير معالَج: ' + e.reason));
  win.Audio = class extends win.EventTarget {
    constructor(src = '') { super(); this.src = src; this.preload = ''; this.currentTime = 0; }
    play() {
      const key = (this.src.split('/').pop() || '').split('?')[0].replace('.mp3', '');
      played.push(manifest[key] ?? `?${key}`);
      setTimeout(() => this.dispatchEvent(new Event('ended')), 5);
      return Promise.resolve();
    }
    pause() {}
  };
  win.SpeechSynthesisUtterance = class { constructor(text) { spoken.push(text); this.text = text; } };
}

async function reload() {
  const done = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  frame.src = 'index.html';
  await done;
  attach();
  await sleep(120);
}

await new Promise((r) => frame.addEventListener('load', r, { once: true }));
attach();

const $ = (sel) => doc.querySelector(sel);
const $$ = (sel) => [...doc.querySelectorAll(sel)];
const texts = (sel) => $$(sel).map((el) => el.textContent.trim());
// **كرسيُّ الألف يُردّ إلى الألف** (الحكم ب٩، جلسة وز٣): الألفُ المتحرّكة تُرسم
// «أَ إِ أُ» — رسمُ الألفِ مع حركتها لا حرفٌ جديد، فلا يُعَدّ في قياس المفكوكية
// حرفاً لم يُدرَّس. وتبقى «ء ؤ ئ» غريبةً يمسكها الحارسُ كما كان.
const bare = (s) => s.replace(/[ً-ْٰـ\s]/g, '').replace(/[أإ]/g, 'ا');
const lastPlayed = () => played[played.length - 1];
const btn = (label) => $$('.btn').find((b) => b.textContent.includes(label));

async function goto(hash) {
  win.location.hash = hash;
  await sleep(100);
}
const stepName = () => $('.step--now .step-name')?.textContent;
const clickNext = async () => { (await waitFor(() => $('.next'), 'زر تابع')).click(); await sleep(70); };

/** كل حرف عربي معروض للقراءة (لا نصوص الواجهة) ⊆ المدروس — مفكوكية ١٠٠٪. */
function assertDecodable(studied, where) {
  const sel = '.giant, .form-face, .vchip-face, .word-text, .celebrate-face';
  const shown = new Set([...bare(texts(sel).join(''))].filter((c) => /[ء-ي]/.test(c)));
  const bad = [...shown].filter((c) => !studied.includes(c));
  ok(bad.length === 0, `${where}: لا حرف غير مدروس في سطح القراءة${bad.length ? ' — ' + bad.join('،') : ''}`);
}

/** كل ما يُنقَر عليه في الشاشة ≥ ٤٨ بكسل (إصبع طفل على آيباد). */
function checkTargets(where) {
  const small = $$('.lesson button')
    .map((el) => [el, el.getBoundingClientRect()])
    .filter(([, r]) => r.width && (r.height < 48 || r.width < 48))
    .map(([el]) => el.className);
  ok(small.length === 0, `${where}: أهداف اللمس ≥٤٨ بكسل${small.length ? ' — ' + small.join('،') : ''}`);
}

/**
 * يخوض **أسئلة خطوة الحركات كلَّها** ويتحقّق أنّ الحركات الثلاث تُقاس في كل تشغيل:
 * كانت جولةً واحدةً على الفتحة أبداً، فبقي ٥٦ مفتاحاً (٢٨ حرفاً × كسرةٍ وضمّة) يُفتح
 * في الجرد ولا يقيسه أحدٌ في الرحلة كلِّها (حارسُ الوعد، سورُه الأوّل).
 */
async function playHarakat(faces, { missFirst = false } = {}) {
  const heard = [];
  let mark = played.length;
  btn('أيها سمعت').click();
  for (let ask = 1; ask <= faces.length; ask++) {
    await waitFor(() => played.length > mark, `نداء السؤال ${ask}`, 4000);
    const target = lastPlayed();
    heard.push(target);
    ok(faces.includes(target), `السؤال ${ask}: المسموع «${target}» من بطاقات الحرف`);
    if (ask === 1) ok(target === faces[0], `والأولُ على الفتحة دائماً — §٥.١ والحكم ج٨ (${target})`);
    const faceOfChip = (c) => c.querySelector('.vchip-face').textContent;
    if (missFirst && ask === 1) {
      const wrong = $$('.vchip').find((c) => faceOfChip(c) !== target);
      wrong.click();
      await sleep(80);
      ok(wrong.classList.contains('bad'), 'الاختيار الخاطئ يُعلَّم ولا ينتقل');
      ok(!$('.next'), 'زر «تابع» لا يظهر قبل الإجابة الصحيحة');
      await sleep(700);                    // إعادةُ السماع بعد الخطأ
    }
    const right = $$('.vchip').find((c) => faceOfChip(c) === target);
    const quiet = played.length;
    right.click();
    await sleep(90);
    ok(right.classList.contains('good'), `السؤال ${ask}: الاختيار الصحيح يُعلَّم`);
    ok(played.length === quiet, `السؤال ${ask}: ولا يُعاد نطقه (DESIGN §٥.٢)`);
    if (ask < faces.length) {
      ok(!$('.next'), `السؤال ${ask}: ولا «تابع» قبل تمام الحركات الثلاث`);
      mark = played.length;
      await sleep(950);                    // نداءُ التالي بعد سكوت القناة ومهلة العين (٧٥٠)
    }
  }
  ok(!!$('.next'), 'زر «تابع» ظهر بعد تمام الأسئلة الثلاثة');
  // **التغطيةُ لا العدد**: الحركاتُ الثلاث كلُّها سُئل عنها في هذا التشغيل بعينه
  ok(new Set(heard).size === faces.length && faces.every((f) => heard.includes(f)),
    `والحركاتُ الثلاث كلُّها قِيست في الدرس الواحد (${heard.join('|')})`);
}

/** يخوض جولات «ميّز بأذنك» بلا خطأ ويتحقّق من سلامة كل جولة. */
async function playQuiz(studied, expectedOptions) {
  // جولتان لا ثلاث (بوابةُ تصميم ع٢: سقفُ §٤ خمسُ جولاتٍ، وخطوةُ الحركات تأخذ ثلاثاً)
  const targets = [];
  for (let round = 1; round <= 2; round++) {
    await waitFor(() => $$('.vchip--big').length > 0, 'خيارات الجولة');
    await sleep(340);                     // الهدف يُشغَّل بعد ربع ثانية من بدء الجولة
    const heard = lastPlayed();
    const opts = texts('.vchip--big');
    ok(opts.length === expectedOptions, `الجولة ${round}: ${expectedOptions} خيارات (${opts.join('|')})`);
    ok(opts.every((o) => studied.includes(bare(o))), `الجولة ${round}: الخيارات من المدروس فقط`);
    ok(opts.includes(heard), `الجولة ${round}: المسموع «${heard}» بين الخيارات`);
    ok(new Set(opts.map((o) => o.slice(1))).size === 1, `الجولة ${round}: حركة واحدة لكل الخيارات`);
    // **وبالفتحة**: مفتاحُ هذا التمرين في الجرد المُعلَن حرفٌ بالفتحة — التمييزُ على
    // الحرف والحركةُ مركبٌ لا مقيس (حكمُ المدير في بوابة ع٢).
    ok(opts.every((o) => o.slice(1) === HARAKAT[0].mark), `الجولة ${round}: وبالفتحة — مفتاحُها المُعلَن`);
    targets.push(bare(heard));
    assertDecodable(studied, `الجولة ${round}`);
    if (round === 1) checkTargets('ميّز بأذنك');
    const chip = $$('.vchip--big').find((c) => c.textContent === heard);
    const mark = played.length;
    chip.click();
    await sleep(300);                     // نداء الجولة التالية لا يأتي قبل ٧٥٠+٢٥٠ م.ث
    // DESIGN §٥.٢: الصواب أثرٌ بصريّ بلا إعادة قراءة — وإلا لتلاصق صوتان
    ok(played.length === mark, `الجولة ${round}: النقرة الصحيحة لا تشغّل صوتاً`);
    ok(chip.classList.contains('good'), `الجولة ${round}: وأثرُها بصريّ على البلاطة`);
    await sleep(700);
  }
  // **مفاتيحُ مضمونة**: الأولى على حرف الدرس والثانية مراجعةٌ لحرفٍ سبقه — لا اقتراعٌ
  // يقع على حرفٍ واحد مرّتين فيضيع مفتاحُ غيره.
  ok(new Set(targets).size === targets.length, `وهدفا الجولتين حرفان لا حرفٌ مرّتين (${targets.join('|')})`);
}

try {
  // ————— الخريطة —————
  await waitFor(() => $('.station'), 'الخريطة');
  // المحطات السبع = محطاتُ المجموعات. وما عداها محطاتٌ من نوعٍ آخر تُستثنى بصنفها
  // (استراحة · قرآن · بستان · سلّم · مكتبة · بوابة · ميّز بين · شجرة جذر).
  ok($$('.station:not(.station--pause):not(.station--quran):not(.station--garden)'
    + ':not(.station--ladder):not(.station--library):not(.station--gate)'
    + ':not(.station--contrast):not(.station--roots)').length === 7,
    'الخريطة تعرض المحطات السبع');
  // **العددُ يُحسب من الرحلة لا يُكتب** (تصحيح ٢٢ أغسطس ٢٠٢٦: كان «٦» بيدٍ فاحمرّ
  // يومَ وُلدت قصةُ وز٣ الرابعة بعد المجموعة ٧ — الصنفُ المقفل: الرقمُ يُشتقّ).
  const interludes = (await import('./js/progress.js')).journey()
    .filter((s) => s.kind === 'interlude').length;
  ok($$('.station--pause').length === interludes,
    `ومحطات المهارات والقصص بينها (${$$('.station--pause').length} من ${interludes} محسوبةً)`);
  ok($$('.station--gate').length === 2,
    `وبوابتا الإتقان قبل المفصلين (${$$('.station--gate').length} — الحزمة ١٤)`);
  // **محطاتُ القرآنية محسوبةٌ لا مكتوبة** (حزمة «مفاصل المرحلة القرآنية»): كانت
  // عقدةً واحدة تحت عنوانٍ واحد فشُقّت محطاتٍ مسمّاة — تهيئةٌ ورسمٌ وسورٌ قصار،
  // وعددُ الأخيرة من عدد السور. فسورةٌ تُضاف تفتح محطتَها بلا سطرٍ يُعدَّل هنا.
  const { QURAN } = await import('/js/curriculum.js');
  const { SURAHS_PER_STATION } = await import('/js/progress.js');
  // مفاصلُ المرحلة بعد وز١/وز٢: تهيئةٌ ورسمان ودفعاتُ السور — تُشتقّ لا تُكتب
  const quranStations = 3 + Math.ceil(QURAN.surahs.length / SURAHS_PER_STATION);
  ok($$('.station--quran').length === quranStations,
    `والمرحلة القرآنية بعدها في ${quranStations} محطاتٍ مسمّاة (${$$('.station--quran').length})`);
  ok($$('.station--garden').length >= 8, `وبساتين الموضوعات بعدها (${$$('.station--garden').length} بستاناً — الحزمة ٧)`);
  // **ورفُّ القراءة الطويلة ليس مكتبةَ بستان**: يحمل الصنفين في الشكل (`station--library
  // station--shelf`) وموضعُه ذيلُ الرحلة لا خاتمةُ سلّم — فيُعَدّ وحدَه (حزمة «رفّ المكتبة»).
  const libraries = $$('.station--library:not(.station--shelf)').length;
  // بعد شقّ البستان بالنوع (وز١): بستانان وسلّمان لكل موضوع، والمكتبةُ واحدةٌ خاتمتَه
  ok(libraries * 2 === $$('.station--ladder').length,
    `ومكتبةُ قصصٍ خاتمةَ كل موضوعٍ مشقوق (${libraries} مكتبة — الحزمة ٩ ووز١)`);
  ok($$('.station--shelf').length === 1,
    `ورفُّ القراءة الطويلة واحدٌ في ذيل الرحلة (${$$('.station--shelf').length})`);
  ok($$('.station--ladder').length === $$('.station--garden').length,
    `وسلّم جملٍ بعد كل بستان خاتمةً (${$$('.station--ladder').length} سلّماً — الحزمة ٨)`);

  // ————— درس الألف: أول درس في الرحلة —————
  await goto('#/lesson/g1/%D8%A7');
  await waitFor(() => $('.lesson'), 'شاشة الدرس');
  ok(texts('.step-name').join('|') === 'اسمع وشاهد|الحركات|تتبّع',
    `أول درس: ثلاث خطوات بلا «ميّز بأذنك» (${texts('.step-name').join('|')})`);
  ok($('.giant').textContent === 'ا', 'الحرف كبيراً في الخطوة الأولى');
  ok($$('.form-cell').length === 4, 'أشكاله الأربعة معروضة');
  ok(!$('.example'), 'لا كلمة مثال للألف (لا كلمة مفكوكة بعد)');
  assertDecodable('ا', 'درس الألف');

  btn('اسمه').click();
  await sleep(40);
  ok(lastPlayed() === 'أَلِف', `زر «اسمه» يشغّل اسم الحرف (${lastPlayed()})`);
  $('.giant').click();
  await sleep(40);
  // بطاقاتُ الألف وصوتُها «أَ إِ أُ» (الحكم ب٩) — والمفتاحُ نصُّه فالملفّ هو الملف.
  ok(lastPlayed() === 'أَ', `الحرف الكبير يشغّل صوته (${lastPlayed()})`);

  // الخطوة ٢: الحركات — نتعمّد خطأً واحداً
  await clickNext();
  ok(stepName() === 'الحركات', 'انتقلنا إلى خطوة الحركات');
  ok(texts('.vchip-face').join('|') === 'أَ|إِ|أُ', `الحركات الثلاث معروضة (${texts('.vchip-face').join('|')})`);
  $$('.vchip')[1].click();
  await sleep(40);
  ok(lastPlayed() === 'إِ', 'نقرة على البلاطة تُسمعها قبل السؤال');

  // بطاقاتُ الألف «أَ إِ أُ» (الحكم ب٩) — والحركاتُ الثلاث تُسأل كلُّها في الدرس الواحد
  await playHarakat(['أَ', 'إِ', 'أُ'], { missFirst: true });

  // الخطوة ٣: التتبّع
  await clickNext();
  ok(stepName() === 'تتبّع', 'انتقلنا إلى خطوة التتبّع');
  const canvas = await waitFor(() => $('canvas.trace'), 'لوح التتبّع');
  await sleep(150);
  ok(canvas.width > 0 && canvas.height > 0, `اللوح مقاس فعلياً (${canvas.width}×${canvas.height})`);
  const ctx = canvas.getContext('2d');
  const ink = () => [...ctx.getImageData(4, canvas.height - 80, 60, 60).data]
    .filter((v, i) => i % 4 === 3 && v > 0).length;
  const box = canvas.getBoundingClientRect();
  const before = ink();
  const pe = (type, x, y) => canvas.dispatchEvent(new win.PointerEvent(type,
    { clientX: x, clientY: y, pointerId: 1, bubbles: true, cancelable: true, isPrimary: true }));
  const y0 = box.top + box.height - 40;
  pe('pointerdown', box.left + 10, y0);
  for (let i = 1; i <= 12; i++) pe('pointermove', box.left + 10 + i * 3, y0 - i * 2);
  pe('pointerup', box.left + 46, y0 - 24);
  await sleep(40);
  const after = ink();
  ok(after > before, `الرسم بالإصبع يترك أثراً على اللوح (${before}→${after})`);
  const scrolled = doc.documentElement.scrollTop;
  btn('امسح').click();
  await sleep(40);
  ok(ink() <= before, 'زر «امسح» يمسح الرسم ويُبقي النموذج الباهت');
  ok(scrolled === doc.documentElement.scrollTop, 'الرسم لا يمرّر الصفحة');

  // الختام: نجمتان (خطأ واحد)
  btn('تمّ').click();
  await waitFor(() => $('.celebrate'), 'شاشة الاحتفال');
  ok($$('.big-stars .on').length === 2, `خطأ واحد ⇒ نجمتان (${$$('.big-stars .on').length})`);
  ok(JSON.parse(win.localStorage.getItem('muallim.progress.v1')).stars['g1:ا'] === 2,
    'النجمتان محفوظتان في localStorage');

  // ————— العودة للخريطة وفتح الحرف التالي —————
  $('.celebrate .btn--primary').click();   // زر الاحتفال لا زر الشريط العلوي
  await waitFor(() => $('.station'), 'العودة للخريطة');
  ok($('[data-next]')?.getAttribute('aria-label')?.includes('باء'), 'الخريطة تشير إلى حرف الباء تالياً');

  // ————— درس الباء: أربع خطوات وكلمة مثال ملوَّنة، وثلاث نجوم بلا خطأ —————
  await goto('#/lesson/g1/%D8%A8');
  await waitFor(() => $('.lesson'), 'درس الباء');
  ok(texts('.step-name').join('|') === 'اسمع وشاهد|الحركات|تتبّع|ميّز بأذنك', 'درس الباء بأربع خطوات');
  ok($('.example-word .word-text').textContent === 'بَابَا', `كلمة المثال: ${$('.example-word .word-text').textContent}`);
  ok(texts('.lit').join('|') === 'بَ|بَ', `الحرف ملوَّن داخل الكلمة مرتين (${texts('.lit').join('|')})`);
  ok(texts('.form-face').join('|') === 'ب|بـ|ـبـ|ـب', `أشكال الباء الأربعة (${texts('.form-face').join('|')})`);
  assertDecodable('اب', 'درس الباء');
  // لون المرحلة يأتي من لوح DESIGN §٢ (متغيرات CSS) — يُقاس مقصد التلوين لا قيمة اللون:
  // الحرف المستهدف بلون حروف المرحلة نفسه (كالأشكال الأربعة) ومختلفاً عن نص الكلمة.
  const litColor = win.getComputedStyle($('.lit')).color;
  ok(litColor === win.getComputedStyle($('.form-face')).color
    && litColor !== win.getComputedStyle($('.example-word')).color,
    `الحرف المستهدف بلون المرحلة داخل الكلمة (${litColor})`);
  checkTargets('الخطوة الأولى');
  $('.example-word').click();
  await sleep(40);
  ok(lastPlayed() === 'بابا', `كلمة المثال تُسمع كاملة (${lastPlayed()})`);

  await clickNext();
  await playHarakat(['بَ', 'بِ', 'بُ']);
  await clickNext();
  btn('تمّ').click();
  await sleep(80);
  ok(stepName() === 'ميّز بأذنك', 'وصلنا إلى «ميّز بأذنك»');
  await playQuiz('اب', 2);

  await waitFor(() => $('.celebrate'), 'احتفال درس الباء');
  ok($$('.big-stars .on').length === 3, `بلا أخطاء ⇒ ثلاث نجوم (${$$('.big-stars .on').length})`);
  ok(JSON.parse(win.localStorage.getItem('muallim.progress.v1')).stars['g1:ب'] === 3,
    'ثلاث نجوم محفوظة للباء');

  $$('.celebrate .btn').find((b) => b.textContent.includes('أعِد')).click();
  await sleep(90);
  ok(stepName() === 'اسمع وشاهد' && $$('.step').length === 4, 'زر «أعِد الدرس» يبدأ الدرس من أوله');

  // ————— القفل محروس في التوجيه —————
  await goto('#/lesson/g1/%D9%84');
  await sleep(150);
  ok(!!$('.station'), 'درس مقفل (لام) يعيد الطفل إلى الخريطة');

  // ————— درس متأخّر (راء في المجموعة ٢): ثلاثة خيارات من ستة حروف مدروسة —————
  win.localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 1,
    stars: Object.fromEntries(
      ['g1:ا', 'g1:ب', 'g1:م', 'g1:ل', 'g1:words', 'skill:madd-alif', 'g2:ن'].map((k) => [k, 3])),
    seconds: 0, errors: {}, startedAt: Date.now(), updatedAt: Date.now(),
  }));
  await reload();
  await goto('#/lesson/g2/%D8%B1');
  await waitFor(() => $('.lesson'), 'درس الراء');
  ok($('.example-word .word-text').textContent === 'نَارْ', `كلمة مثال الراء: ${$('.example-word .word-text').textContent}`);
  assertDecodable('ابملنر', 'درس الراء');
  await clickNext();
  await playHarakat(['رَ', 'رِ', 'رُ']);
  await clickNext();
  btn('تمّ').click();
  await sleep(80);
  await playQuiz('ابملنر', 3);
  await waitFor(() => $('.celebrate'), 'احتفال درس الراء');
  ok(JSON.parse(win.localStorage.getItem('muallim.progress.v1')).stars['g2:ر'] === 3, 'نجوم الراء محفوظة');

  // بعد الإتمام لا يُسأل الطفل «تريد الخروج؟» — زر الشريط العلوي ينقله مباشرة
  btn('الخريطة').click();
  await sleep(200);
  ok(!!$('.station'), 'زر الشريط العلوي بعد الإتمام يعود للخريطة بلا استئذان');
  ok($$('.node--done').length >= 3, `العقد المنجَزة تظهر منجَزة على الخريطة (${$$('.node--done').length})`);

  // ————— الصوت والأخطاء —————
  const missing = played.filter((t) => t.startsWith('?'));
  ok(missing.length === 0, `كل ما شُغِّل له ملف مولَّد (${played.length} تشغيلاً، ${missing.length} ناقصاً)`);
  const stray = spoken.filter((t) => !pendingAudio.has(t));
  ok(stray.length === 0, `لم يُستعمل النطق الآلي إلا لنصّ ينتظر التصريف `
    + `(${spoken.length - stray.length} منتظِراً${stray.length ? '، خارج القائمة: ' + stray.join('، ') : ''})`);
  ok(jsErrors.length === 0, `لا أخطاء جافاسكربت (${jsErrors.join(' | ') || 'لا شيء'})`);
} catch (e) {
  ok(false, 'استثناء: ' + ((e && e.stack) || e));
}

await fetch('/result', { method: 'POST', body: JSON.stringify(results, null, 1) });
</script>
</body>
</html>
