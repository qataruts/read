<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>قياس الجهاز: الطول والوضعان</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* لا زينةَ في هذه الصفحة: هي شاشةُ التطبيق نفسُها بمقاس الجهاز، وإلا كذب القياس */
    html, body { margin: 0; }
    /* لوح المعايرة وحدَه: خطُّ منتصف الصندوق هندسياً تُقاس إليه كتلةُ الحبر بالعين */
    .giant--probe { position: relative; }
    .giant--probe::after {
      content: ''; position: absolute; inset-inline: 0; top: 50%;
      height: 1px; background: rgba(200, 0, 0, .55);
    }
  </style>
</head>
<body>
<div id="app" class="app" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

<script>
// عطبٌ في الصفحة يُكتب فيها — فاللقطة البيضاء الصامتة تحيّر
const shout = (what) => {
  const box = document.createElement('pre');
  box.style.cssText = 'color:#b00;font:14px/1.6 monospace;white-space:pre-wrap';
  box.textContent = 'عطب: ' + what;
  document.body.prepend(box);
};
window.addEventListener('error', (e) => shout(e.message));
window.addEventListener('unhandledrejection', (e) => shout(e.reason?.stack || e.reason));
</script>

<!-- تقدّم مزروع قبل تحميل الوحدات: طفلٌ بلغ البوابة وفي سجلّه ضعيفٌ وقويّ -->
<script>
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
  const skill = (right, wrong, box, due) => ({ right, wrong, box, due: day + due, seen: day });
  localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 2,
    stars: {}, skills: {
      'ك|fatha|quiz': skill(1, 4, 0, 0),
      'ق|kasra|quiz': skill(0, 3, 0, 0),
      'ط|damma|haraka': skill(2, 3, 0, 0),
      'ص|fatha|quiz': skill(1, 2, 0, 0),
      'ض|fatha|haraka': skill(3, 1, 1, 1),
      'ظ|kasra|quiz': skill(4, 0, 4, 8),
      'ب|fatha|build': skill(2, 2, 0, 0),
      'م|sukun|read': skill(1, 3, 0, 0),
    },
    days: {}, reviews: {}, records: [], mic: false, seconds: 30 * 60,
    startedAt: Date.now(), updatedAt: Date.now(),
  }));
</script>

<script type="module">
import { renderLesson } from './js/lesson.js';
import { renderSkillLesson } from './js/skill.js';
import { renderGate } from './js/gate.js';
import { renderContrast } from './js/contrast.js';
import { renderQuran } from './js/quran.js';
import { surahWordsPart } from './js/curriculum.js';
import { renderWordsGame } from './js/words.js';
import { renderGarden } from './js/garden.js';
import { renderLadder } from './js/ladder.js';
import { renderStory } from './js/story.js';
import { renderReview } from './js/review.js';
import { renderPlacement, rungs } from './js/placement.js';
import * as progress from './js/progress.js';
import { LETTERS } from './js/curriculum.js';
import { GARDENS } from './js/lexicon.js';
import { RUNGS } from './js/sentences.js';
import { h, giantInk, accentFor } from './js/ui.js';

/** أول باقةٍ في أول بستان — معرّفُها مشتقٌّ لا مكتوب، فلا يبلى بتغيّر المعجم. */
const firstBundleId = () => GARDENS[0].bundles[0].id;

/** أول درجةٍ في سلّم الجمل — بمعرّفها المشتقّ كذلك. */
const firstRungId = () => RUNGS[0].id;

// صوت لا ينتهي أبداً: تُجمَّد الحالة المعروضة فلا تنتقل الخطوة تلقائياً قبل القياس
window.Audio = class { play() { return new Promise(() => {}); } pause() {} };

for (const node of progress.allNodes()) progress.setStars(node.id, 3);

const $$ = (root, sel) => [...root.querySelectorAll(sel)];
const hit = (app, label) => $$(app, 'button').find((b) => b.textContent.includes(label))?.click();

/** درس الحرف عند خطوةٍ بعينها (القيادة عينُها في `browser_shots.html`). */
function lessonAt(step) {
  const el = renderLesson('g1', 'ب');
  const drives = [
    () => el.querySelector('.next').click(),
    () => {
      hit(el, 'أيها سمعت');
      $$(el, '.vchip').forEach((c) => c.click());     // إحداها الصحيحة فيظهر «تابع»
      el.querySelector('.next').click();
    },
    () => hit(el, 'تمّ'),
  ];
  for (let i = 0; i < step; i++) drives[i]();
  return el;
}

function skillAt(id, step) {
  const el = renderSkillLesson(id);
  for (let i = 0; i < step; i++) hit(el, 'تابع');
  return el;
}

function surahWordsAt(surahId, step) {
  const el = renderQuran(surahWordsPart(surahId));
  for (let i = 0; i < step; i++) hit(el, 'تابع');
  return el;
}

function contrastAt(id, step) {
  const el = renderContrast(id);
  for (let i = 0; i < step; i++) hit(el, 'تابع');
  return el;
}

/**
 * شاشةُ «امتحان اللحاق» (الجلسة ل٢): أطولُ صورةٍ لمحرّك الجلسة — ترويسةُ البوابة
 * وفوقها سطرُ الدرجة، وثمانيةُ نقاطٍ لا ستّ. فإن فاض شيءٌ فهنا يفيض.
 *
 * وتُبنى على **درجةٍ حقيقية**: الصفحةُ تُتمّ الرحلةَ كلَّها عند تحميلها (فتُفتح كلُّ
 * شاشة) فلا يبقى في السلّم درجة — فتُصفَّر أقسامُ أولِ شريحةٍ لحظةَ البناء ثم تُردّ
 * نجومُها. والعنصرُ المبنيُّ لا يتأثر بالردّ (الدرجةُ محسوبةٌ ساعةَ التركيب)،
 * **فلا تتلوّث شاشةٌ بعدها** — والقياسُ هنا شاشةً شاشةً في صفحةٍ واحدة.
 */
function placementScreen() {
  const rung = rungs()[0];
  const ids = rung.nodes.map((node) => node.id);
  for (const section of rung.sections) progress.clearSection(section.id);
  try {
    return renderPlacement({ onDone: () => {} });
  } finally {
    for (const id of ids) progress.setStars(id, 3);
  }
}

// الحروف الممثِّلة لأصناف الأجرام: ألفٌ طويلة، باءٌ منقوطة تحت، ميمٌ نازلة،
// عينٌ وسطى، غينٌ منقوطة فوق — وعليها تُحكَّم المعايرة بالعين.
const SAMPLE = [...'ابمعغ'];

/** لوح المعايرة: صناديق الحرف البطل وفيها خطُّ المنتصف — تُحكَّم عليه العين. */
function lettersRow() {
  return h('div', { class: 'screen lesson', css: { '--accent': accentFor() } },
    h('main', { class: 'screen-card' },
      h('h2', {}, 'معايرة توسيط الحرف البطل'),
      h('p', { class: 'hint' }, 'الخطّ الأحمر منتصفُ الصندوق هندسياً — والحبر يُقارَن به'),
      h('div', { class: 'row', css: { 'flex-wrap': 'wrap', 'justify-content': 'center' } },
        SAMPLE.map((ch) => h('div', { class: 'giant giant--probe', css: { width: '11rem', height: '11rem', 'font-size': '6.5rem' } },
          giantInk(ch)))),
    ));
}

// الشاشات المقيسة: بطلاتُ «الصندوق الكبير» أولاً، ثم شقيقاتُها الأطول في الرحلة
export const SCREENS = [
  ['lesson-listen', 'الدرس ١ — اسمع وشاهد', () => lessonAt(0)],
  ['lesson-harakat', 'الدرس ٢ — الحركات', () => lessonAt(1)],
  ['lesson-trace', 'الدرس ٣ — تتبّع', () => lessonAt(2)],
  ['lesson-quiz', 'الدرس ٤ — ميّز بأذنك', () => lessonAt(3)],
  ['skill-rule', 'المهارة ١ — القاعدة', () => skillAt('madd-alif', 0)],
  ['skill-compare', 'المهارة ٢ — قارِن بأذنك', () => skillAt('shadda', 1)],
  ['skill-quiz', 'المهارة ٣ — ميّز بأذنك', () => skillAt('tanween', 2)],
  ['contrast-compare', 'ميّز بين ١ — قارِن', () => contrastAt('alike-hard', 0)],
  ['contrast-quiz', 'ميّز بين ٢ — أيَّ حرف سمعت؟', () => contrastAt('alike-hard', 1)],
  ['quran-letters', 'القرآنية — الهمزة والتاء', () => renderQuran('letters')],
  ['quran-words', 'القرآنية — كلمات (درجة ٣)', () => renderQuran('words3')],
  ['quran-rasm', 'القرآنية — الرسم', () => renderQuran('rasm')],
  // أكثفُ شاشتين في الرحلة: ٢٦ بطاقةَ كلمةٍ عثمانية، ثم أطولُ آيةٍ في المصحف الصغير
  ['surah-words', 'كلمات السورة ١ — البطاقات', () => surahWordsAt('s1', 0)],
  ['surah-find', 'كلمات السورة ٢ — جِدْها في الآية', () => surahWordsAt('s1', 1)],
  ['gate', 'بوابة المصحف', () => renderGate('quran')],
  ['placement', 'امتحان اللحاق', () => placementScreen()],
  ['words', 'لعبة تركيب الكلمات', () => renderWordsGame('g1')],
  ['garden', 'بستان المعجم', () => renderGarden(firstBundleId())],
  ['ladder', 'سلّم الجمل', () => renderLadder(firstRungId())],
  ['story', 'قراءة قصة', () => renderStory('st1')],
  ['review', 'المراجعة اليومية', () => renderReview()],
  ['letters', 'لوح معايرة الحرف', () => lettersRow()],
];

const app = document.getElementById('app');
const params = new URLSearchParams(location.search);

// `?flat=1` يعطّل رفعة الحرف — به تُلتقط لقطةُ «قبل» بعد التعديل فتُقارَن بـ«بعد»
if (params.get('flat')) {
  const off = document.createElement('style');
  off.textContent = '.giant-ink { transform: none !important; }';
  document.head.append(off);
}

function show(build) {
  const node = build();
  // شاشةٌ تعود بـ`null` (معرّفٌ مجهول) تُقاس صفحةً خاوية فتُقال «تسع الشاشة» كذباً
  if (!node || !node.nodeType) throw new Error('لم تُبنَ الشاشة (معرّف مجهول؟)');
  app.replaceChildren(node);
  document.querySelectorAll('.dev').forEach((d) => d.remove());   // أدوات التجربة لا تُقاس
}

/**
 * حارسُ «أيقونات لا إيموجي» على الشاشة نفسِها (لا على الشيفرة وحدها):
 * أيُّ محرفِ إيموجي بقي **نصّاً** في الشاشة يرسمه خطُّ الجهاز — فيختلف من جهازٍ
 * إلى جهاز وقد يغيب أصلاً. والمقيس نصوصُ الشاشة لا سماتُها: `data-emoji` على
 * الصورة إعلانٌ لما ترسمه لا محرفٌ يُقرأ، فلا يُعَدّ.
 *
 * وهذه الصفحة تبني كلَّ شاشات الرحلة واحدةً واحدة، فالفحصُ عليها فحصٌ للتطبيق كلِّه.
 */
const EMOJI_IN_TEXT = /[\u{231A}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F000}-\u{1FAFF}]\u{FE0F}?|.\u{FE0F}/gu;
// محارفُ نصّية متعمَّدة يرسمها خطُّ النصّ نفسُه، لا إيموجي (DESIGN §٦ ومعالمُ الواجهة)
const TEXT_OK = new Set(['\u06DE', '\u2726', '\u2605', '\u2606', '\u2713', '\u2717',
  '\u2190', '\u2192', '\u21BB', '\u22EE', '\u25B6', '\u2715']);

function systemEmoji(root) {
  const doc = root.ownerDocument || document;      // يعمل عبر إطارٍ كما يعمل في الصفحة
  const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const found = new Set();
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    for (const m of node.data.matchAll(EMOJI_IN_TEXT)) {
      if (!TEXT_OK.has(m[0])) found.add(m[0]);
    }
  }
  return [...found].join('');
}

/**
 * معايرة توسيط الحرف البطل في صندوقه.
 *
 * الخطّ العربي يُجلس الحرف على خطّ أساسٍ لا في وسط سطره: مع `line-height: 1` يقع خطّ
 * الأساس أسفلَ مركز السطر بمقدار `(صعود − هبوط) ÷ ٢` من مقاييس الخطّ نفسِه. وحبرُ الحرف
 * يتوزّع حول خطّ الأساس بحسب جِرمه (ألفٌ صاعدة، ميمٌ نازلة، باءٌ منقوطة تحت). فمركز
 * الحبر من مركز الصندوق = (صعود − هبوط)÷٢ + (هبوطُ الحبر − صعودُه)÷٢، وموجبُه يعني
 * أن الحرف يجلس **تحت** المنتصف — وهو عينُ ما رآه المالك على الآيباد.
 */
function metrics() {
  // الصناديق تُبنى بالطريق نفسِه الذي يبنيه الدرس (`giantInk`) ثم يُقرأ **الأثر المطبَّق**
  // من الشاشة لا من الحساب — فيُختبَر السلك كلُّه: القياس، ووحدة em، وترجمة CSS.
  const boxes = Object.keys(LETTERS).map((ch) => {
    const el = h('div', { class: 'giant' }, giantInk(ch));
    return { ch, el };
  });
  app.replaceChildren(h('div', {}, boxes.map((b) => b.el)));

  const cs = getComputedStyle(boxes[0].el);
  const size = parseFloat(cs.fontSize);
  const font = `${size}px ${cs.fontFamily}`;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  const probe = ctx.measureText('ب');
  const asc = probe.fontBoundingBoxAscent, desc = probe.fontBoundingBoxDescent;

  const rows = boxes.map(({ ch, el }) => {
    const m = ctx.measureText(ch);
    const off = (asc - desc) / 2 + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
    // الأثر المطبَّق: `matrix(a, b, c, d, tx, ty)` — والسادس هو الرفعة بالبكسل
    const t = getComputedStyle(el.firstChild).transform;
    const ty = t && t.startsWith('matrix') ? parseFloat(t.slice(t.indexOf('(') + 1).split(',')[5]) : 0;
    return { ch, off, ty, rest: off + ty };
  });
  app.replaceChildren();
  return { font, size, asc, desc, base: (asc - desc) / 2, rows };
}

if (params.get('metrics')) {
  // الصفحة تبدأ خاليةً فلا يُطلَب خطُّ النسخ من تلقائه — ولا تصحّ المعايرة بخطٍّ احتياطيّ
  document.fonts.load('200px "Noto Naskh Arabic"', 'اب')
    .then(() => fetch('/result?from=read', { method: 'POST', body: JSON.stringify([metrics()]) }));
} else if (params.get('screen')) {
  const found = SCREENS.find(([id]) => id === params.get('screen'));
  if (!found) shout('لا شاشة بهذا الاسم: ' + params.get('screen'));
  else show(found[2]);
} else {
  // وضع القياس: شاشةً شاشةً، ويُرسَل الفائض الرأسي والأفقي بمقاس النافذة الحالي
  const out = [];
  const vw = innerWidth, vh = innerHeight;
  const orient = vw > vh ? 'عرضي' : 'طولي';
  for (const [id, label, build] of SCREENS) {
    try {
      show(build);
      const doc = document.documentElement;
      out.push({
        id, label, orient, vw, vh,
        h: doc.scrollHeight,
        over: Math.max(0, doc.scrollHeight - vh),
        overX: Math.max(0, doc.scrollWidth - vw),
        emoji: systemEmoji(app),
      });
    } catch (e) {
      out.push({ id, label, orient, vw, vh, error: String(e && e.message || e) });
    }
  }
  app.replaceChildren();

  /**
   * **صفحاتُ «المرجع التعريفيّ» في عدّة الجهاز** (حكم المدير، المرحلة الثانية):
   * جمهورُها معلّمون على أجهزةٍ شتّى، فيُقاس فائضُها على المقاسات الخمسة نفسِها.
   *
   * و**المقيسُ الأفقيُّ وحدَه**: هذه صفحاتُ مستندٍ تُقرأ بالسحب الرأسيّ بطبعها —
   * فطولُها ليس عيباً، وإنما العيبُ أن تفيض عرضاً فتُسحَب الصفحةُ يميناً وشمالاً
   * (DESIGN §٤). وتُقاس في إطارٍ بمقاس المنظور: الصفحةُ ليست وحدةَ تطبيقٍ تُبنى
   * باستيراد، بل مستندٌ يُفتَح.
   */
  const PAGES = [
    ['welcome-index', 'المرجع — الرئيسة', 'welcome/'],
    ['welcome-curriculum', 'المرجع — المنهج', 'welcome/curriculum.html'],
    ['welcome-method', 'المرجع — الأسس', 'welcome/method.html'],
    ['welcome-guide', 'المرجع — الدليل العملي', 'welcome/guide.html'],
  ];
  const frame = document.createElement('iframe');
  frame.style.cssText = `width:${vw}px;height:${vh}px;border:0;display:block`;
  document.body.append(frame);
  for (const [id, label, src] of PAGES) {
    try {
      await new Promise((done, fail) => {
        frame.addEventListener('load', done, { once: true });
        setTimeout(() => fail(new Error('لم تُفتح الصفحة')), 15000);
        frame.src = src;
      });
      const d = frame.contentDocument;
      await d.fonts.ready;
      for (const im of d.images) im.loading = 'eager';
      await new Promise((r) => setTimeout(r, 200));
      out.push({
        id, label, orient, vw, vh,
        h: d.documentElement.scrollHeight,
        over: 0,                       // مستندٌ يُسحَب رأسياً بطبعه — لا يُقاس طولُه
        overX: Math.max(0, d.documentElement.scrollWidth - d.documentElement.clientWidth),
        emoji: systemEmoji(d.body),
      });
    } catch (e) {
      out.push({ id, label, orient, vw, vh, error: String(e && e.message || e) });
    }
  }
  frame.remove();

  // **بصمةُ المصدر `?from=read`** (بلاغا العائلة، ١٢ أغسطس ٢٠٢٦): الخادمُ يرفض تقريراً
  // بلا بصمة — وهذه الصفحةُ وحدَها بقيت بلا واحدة يومَ سُنّت القاعدة، فكان `--device`
  // يردّ «لم تصل نتيجة» على كل مقاس. (تشخيصُ الجلسة ل٢، وهو سابقٌ لها.)
  fetch('/result?from=read', { method: 'POST', body: JSON.stringify(out) });
}
</script>
</body>
</html>
