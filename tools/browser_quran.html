<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>اختبار المرحلة القرآنية والعمل دون إنترنت</title></head>
<body>
<pre id="out" style="font:14px/1.6 monospace"></pre>
<iframe id="frame" src="index.html" style="width:420px;height:900px;border:1px solid #ccc"></iframe>
<script>
const report = (what) => navigator.sendBeacon('/result',
  new Blob([JSON.stringify([{ ok: false, msg: 'استثناء في صفحة الاختبار: ' + what }])],
    { type: 'text/plain' }));
window.addEventListener('error', (e) => report(e.message));
window.addEventListener('unhandledrejection', (e) => report(e.reason?.stack || e.reason));
</script>
<script type="module">
const out = document.getElementById('out');
const results = [];
const post = () => navigator.sendBeacon('/result',
  new Blob([JSON.stringify(results, null, 1)], { type: 'text/plain' }));
const ok = (cond, msg) => {
  results.push({ ok: !!cond, msg });
  out.textContent += `${cond ? '✓' : '✗'} ${msg}\n`;
  post();
};
setTimeout(() => { ok(false, 'انتهت المهلة الكلية'); post(); }, 110000);

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function waitFor(fn, label = '', ms = 4000) {
  const t0 = Date.now();
  for (;;) {
    let v; try { v = fn(); } catch { v = null; }
    if (v) return v;
    if (Date.now() - t0 > ms) throw new Error('انتظار طويل: ' + label);
    await sleep(25);
  }
}

const {
  QURAN, quranMushafTexts, quranSpokenTexts, quranWordTexts, quranWordItems,
  surahWords, surahWordsPart,
} = await import('./js/curriculum.js');
const { allNodes, SURAHS_PER_STATION } = await import('./js/progress.js');
const { LIBRARY } = await import('./js/library.js');
const manifest = await (await fetch('audio/manifest.json')).json();
const recitations = await (await fetch('data/recitations.json')).json();
const pendingAudio = new Set(await (await fetch('/__queue.json')).json());
const frame = document.getElementById('frame');

const played = [], spoken = [], recited = [], recitedWords = [], heardLog = [], jsErrors = [];
let win, doc;

function attach() {
  win = frame.contentWindow;
  doc = frame.contentDocument;
  win.addEventListener('error', (e) => jsErrors.push(String(e.message)));
  win.addEventListener('unhandledrejection', (e) => jsErrors.push('رفض غير معالَج: ' + e.reason));
  // مشغّل مزيّف يميّز مصدر كل صوت: فهرس المولَّد أم بيان تلاوة القارئ.
  // (التلاوة الحقيقية تُفحص بفكّها في متصفّح حقيقي — القسم ١٠ أدناه.)
  win.Audio = class extends win.EventTarget {
    constructor(src = '') { super(); this.src = src; this.preload = ''; this.currentTime = 0; }
    play() {
      const stem = (this.src.split('/').pop() || '').split('?')[0].replace('.mp3', '');
      const key = stem.startsWith('wbw-') ? stem.slice(4) : stem;
      if (stem.startsWith('wbw-')) {           // تلاوةُ كلمةٍ مفردة (الحزمة ١٢)
        const text = (recitations.words || {})[key] ?? `?${key}`;
        recitedWords.push(text);
        heardLog.push(text);
      } else if (key in recitations.ayat) {
        recited.push(recitations.ayat[key]);
        heardLog.push(recitations.ayat[key]);
      } else {
        const text = manifest[key] ?? `?${key}`;
        played.push(text);
        heardLog.push(text);
      }
      setTimeout(() => this.dispatchEvent(new Event('ended')), 5);
      return Promise.resolve();
    }
    pause() { this.dispatchEvent(new Event('pause')); }
    load() {}
  };
  win.SpeechSynthesisUtterance = class {
    constructor(text) { this.text = text; spoken.push(text); heardLog.push(text); }
  };
  const synth = { cancel() {}, speak(u) { setTimeout(() => u.onend && u.onend(), 5); } };
  Object.defineProperty(win, 'speechSynthesis', { configurable: true, get: () => synth });
}

function idsBefore(id) {
  const out = [];
  for (const node of allNodes()) {
    if (node.id === id) return out;
    out.push(node.id);
  }
  return out;
}

async function seed(nodeIds) {
  localStorage.setItem('muallim.progress.v1', JSON.stringify({
    v: 2,
    stars: Object.fromEntries(nodeIds.map((k) => [k, 3])),
    skills: {}, days: {}, reviews: {}, seconds: 0,
    startedAt: Date.now(), updatedAt: Date.now(),
  }));
  const done = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  frame.src = 'index.html';
  await done;
  attach();
  await sleep(150);
}

const stored = () => JSON.parse(localStorage.getItem('muallim.progress.v1'));
const $ = (sel) => doc.querySelector(sel);
const $$ = (sel) => [...doc.querySelectorAll(sel)];
const texts = (sel) => $$(sel).map((el) => el.textContent.trim());
// الرمزُ صار صورةَ SVG لا محرفاً (مهمة «أيقونات لا إيموجي»)، وهو معلَنٌ في
// `data-emoji` على `<img>` — فتقرأ الاختباراتُ ما تراه العينُ لا نصّاً غاب.
const picOf = (el) => el?.querySelector('[data-emoji]')?.dataset.emoji
  ?? el?.textContent.trim() ?? '';
const lastHeard = () => heardLog[heardLog.length - 1];
const btn = (label) => $$('.btn').find((b) => b.textContent.includes(label));
const continueCard = () => $$('.continue').find((c) => c.textContent.includes('تابع من هنا'));
// الخريطة كسولة (إصلاح بطء الخريطة): محطاتٌ بعيدة عن جبهة الطفل تُرسم بطاقاتِ عناوين
// مطوية. وفحوص هذه الصفحة تعدّ عقد الرحلة كلها، فتفردها أولاً — والفرد بنقرة واحدة.
const unfoldAll = () => { for (const b of $$('.station-head--fold')) b.click(); };
const arNum = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d]);

async function goto(hash) {
  win.location.hash = hash;
  await sleep(150);
}

function checkTargets(where) {
  const small = $$('.screen-card button')
    .map((el) => [el, el.getBoundingClientRect()])
    .filter(([, r]) => r.width && (r.height < 48 || r.width < 48))
    .map(([el]) => el.className);
  ok(small.length === 0, `${where}: أهداف اللمس ≥٤٨ بكسل${small.length ? ' — ' + small.join('،') : ''}`);
}

/** يلعب خطوة «اقرأ واختر» كاملةً: خطأ مقصود في جولة ثم الصواب في كلٍّ. */
async function playReadQuiz(items, { mistakeAt = 1 } = {}) {
  // جولةٌ لكل كلمة **مصوَّرة** («صدق الصورة»، DESIGN §٦: الصورة هي السؤال كلُّه هنا،
  // فكلمةٌ لا تصوّرها صورةٌ صادقة تبقى خياراً مكتوباً ولا تكون هدفاً).
  const shown = items.filter((w) => w.pictured !== false);
  for (let round = 1; round <= shown.length; round++) {
    const mark = heardLog.length;
    await waitFor(() => $$('.vchip--word').length === 3, `خيارات الجولة ${round}`);
    const emoji = picOf($('.pick-pic'));
    const target = items.find((w) => w.emoji === emoji);
    const faces = texts('.vchip-face');
    if (round === 1) {
      ok(!!target && faces.includes(target.read),
        `الجولة ١: صورة «${emoji}» وكلمتها بين الخيارات (${faces.join('|')})`);
      ok(shown.length < items.length ? shown.every((w) => w.pictured !== false) : true,
        `والأهداف كلها مصوَّرة (${shown.length} من ${items.length} كلمة)`);
      ok(heardLog.length === mark,
        'ولا يُسمَع شيء قبل الاختيار — الحكم على القراءة لا على السمع');
    }
    if (round === mistakeAt) {
      const wrong = $$('.vchip--word')[faces.findIndex((f) => f !== target.read)];
      wrong.click();
      await sleep(120);
      ok(wrong.classList.contains('bad'), 'الخطأ يُعلَّم ولا ينقل إلى الكلمة التالية');
      ok($$('.vchip--word').length === 3, 'والجولة نفسها باقية');
      await sleep(200);
    }
    $$('.vchip--word')[texts('.vchip-face').indexOf(target.read)].click();
    await sleep(900);
  }
}

try {
  // ————— ١) الخريطة: محطة الخاتمة —————
  await seed([]);
  await waitFor(() => $('.station'), 'الخريطة');
  // **مفاصلُ المرحلة** (بلاغ المالك، ١٢ أغسطس ٢٠٢٦): كانت محطةً واحدة تحمل ٣١ عقدة،
  // فصارت محطاتٍ مسمّاة **محسوبةً من `QURAN.surahs`** — والعددُ يُقرأ من المنهج لا يُكتب.
  const wantStations = 2 + Math.ceil(QURAN.surahs.length / SURAHS_PER_STATION);
  ok($$('.station--quran').length === wantStations,
    `الخريطة فيها ${arNum($$('.station--quran').length)} محطاتٍ قرآنية مسمّاة لا كتلةً واحدة`);
  ok($$('.station--quran').every((el) => el.classList.contains('station--locked')),
    'وكلها مقفلة في بداية الرحلة');
  ok($$('.station--quran h2').every((el) => el.textContent.trim().length > 2),
    `ولكلٍّ عنوانُها على الخريطة (${$$('.station--quran h2').map((e) => e.textContent.trim()).join(' · ')})`);
  const stationEls = $$('.station');
  ok(stationEls.slice(0, stationEls.indexOf($('.station--quran')))
      .every((s) => !s.classList.contains('station--garden')),
    'وموضعها بعد محطات الحروف كلها وقبل بساتين الحزمة ٧');
  unfoldAll();
  // ومعها قصصُ السور: كلُّ قصةٍ عقدةٌ تسبق محطةَ كلمات سورتها (حزمة قصص الأنبياء)
  const SURAH_STORIES = LIBRARY.filter((s) => s.surah).length;
  const QURAN_NODES = 3 + QURAN.words.levels.length + QURAN.surahs.length * 2 + SURAH_STORIES;
  ok($$('.station--quran .node').length === QURAN_NODES,
    `وفيها ${arNum(QURAN_NODES)} عقدة (حرفان، ${arNum(QURAN.words.levels.length)} درجات كلمات، `
    + `رسم، مقطَّعة، و${arNum(QURAN.surahs.length)} سورة كلٌّ بمحطة كلماتها، `
    + `و${arNum(SURAH_STORIES)} قصةَ سورة)`);

  await goto('#/quran/s1');
  ok(!!$('.station') && !$('.story'), 'الدخول المباشر على سورة مقفلة يعيده إلى الخريطة');

  await seed(idsBefore('quran:letters'));
  await waitFor(() => $('.station--quran'), 'الخريطة بعد إتمام الرحلة');
  ok(!$('.station--quran').classList.contains('station--locked'),
    'وتُفتح بإتمام كل ما قبلها');
  ok(continueCard().textContent.includes(QURAN.letters.title),
    `«تابع من هنا» يشير إلى ${QURAN.letters.title}`);

  // ————— ٢) درس الهمزة والتاء المربوطة —————
  await goto('#/quran/letters');
  await waitFor(() => $('.lesson'), 'شاشة درس الحرفين');
  ok($$('.sign-card').length === 2, 'بطاقتان: الهمزة والتاء المربوطة');
  ok(texts('.sign-face').join('') === 'ءة', `وجه كل حرف كبيراً (${texts('.sign-face').join('،')})`);
  ok(texts('.sign-shape').join('') === QURAN.letters.signs.flatMap((s) => s.shapes).join(''),
    `وصور الهمزة معروضة (${texts('.sign-shape').join(' ')})`);

  // **لكل علامةٍ قاعدتُها وزرُّ سماعها** (أذنُ المالك): شُقّت قاعدةُ الدرس الواحدة
  // قاعدتين قصيرتين بلا رمزٍ مقتبس — فالرمزُ المفرد لا اسمَ منطوقاً له فيخمّنه المولّد.
  const ruleBtns = $$('.btn').filter((b) => b.textContent.includes('اسمع القاعدة'));
  ok(ruleBtns.length === QURAN.letters.signs.length,
    `لكل علامةٍ زرُّ قاعدتها (${ruleBtns.length} زرّاً لعلامتين)`);
  for (const [i, sign] of QURAN.letters.signs.entries()) {
    const beforeRule = heardLog.length;
    ruleBtns[i].click();
    await waitFor(() => heardLog.length > beforeRule, `صوت قاعدة ${sign.name}`);
    ok(lastHeard() === sign.rule, `زرُّ قاعدة ${sign.name} يُسمعها وحدَها`);
    ok(!/«/.test(sign.rule), `وقاعدتُها بلا رمزٍ مقتبس (${sign.rule})`);
  }

  // كلمةٌ لكل صورةٍ من صور الحرفين — والصورُ صارت خمساً للهمزة (حزمة «القرآني الموسّع»)
  const words = $$('.example-word');
  const wanted = QURAN.letters.signs.flatMap((s) => s.words);
  ok(words.length === wanted.length,
    `لكلّ صورةٍ كلمتُها المصوَّرة (${words.length} كلمة: ${wanted.map((w) => w.read).join('، ')})`);
  words[0].click();
  await sleep(60);
  ok(lastHeard() === 'مَاءْ', `نقرة الكلمة تُسمعها (${lastHeard()})`);
  checkTargets('درس الحرفين');

  $('.next').click();
  await waitFor(() => $('.vchip--word'), 'خطوة اقرأ واختر');
  await playReadQuiz(QURAN.letters.signs.flatMap((s) => s.words));
  await waitFor(() => $('.celebrate'), 'ختام درس الحرفين');
  ok($$('.big-stars .on').length === 2, `خطأ واحد ⇒ نجمتان (${$$('.big-stars .on').length})`);
  ok(stored().stars['quran:letters'] === 2, 'ونجوم الدرس محفوظة بمعرّف عقدته');
  ok(Object.keys(stored().skills).length === 0,
    'ولا قياس في المرحلة القرآنية (وحدة القياس حرف بحركة في تمرين)');

  // ————— ٣) كلمات من القرآن: ثلاث درجات صاعدة (الحزمة ١٢) —————
  ok(quranWordItems().length >= 24,
    `كلمات المرحلة ${arNum(quranWordItems().length)} على ${arNum(QURAN.words.levels.length)} درجات`);
  for (const level of QURAN.words.levels) {
    await seed(idsBefore(`quran:${level.id}`));
    await goto(`#/quran/${level.id}`);
    await waitFor(() => $('.lesson'), `شاشة ${level.title}`);
    ok($$('.example-word').length === level.items.length,
      `${level.title}: ${arNum(level.items.length)} كلمات، كلُّها في ${arNum(level.size)} حروف فأكثر`);
    $$('.example-word').at(-1).click();
    await sleep(60);
    ok(lastHeard() === level.items.at(-1).read, `وتُسمع بنقرة (${lastHeard()})`);
    $('.next').click();
    await waitFor(() => $('.vchip--word'), 'اقرأ واختر');
    await playReadQuiz(level.items, { mistakeAt: 0 });
    await waitFor(() => $('.celebrate'), `ختام ${level.title}`);
    ok($$('.big-stars .on').length === 3, 'بلا خطأ ⇒ ثلاث نجوم');
    ok(stored().stars[`quran:${level.id}`] === 3, 'ونجوم الدرجة محفوظة بمعرّفها');
  }

  // ————— ٤) رسم المصحف —————
  await seed(idsBefore('quran:rasm'));
  await goto('#/quran/rasm');
  await waitFor(() => $('.rasm-card'), 'شاشة الرسم');
  ok($$('.rasm-card').length === QURAN.rasm.signs.length,
    `${arNum(QURAN.rasm.signs.length)} علامات رسم، كلٌّ بمثالها`);
  ok(texts('.rasm-example .mushaf').join('|') === QURAN.rasm.signs.map((s) => s.read).join('|'),
    'وأمثلتها من المصحف حرفياً كما في المنهج');
  const beforeSign = heardLog.length;
  $$('.rasm-card')[0].click();
  await waitFor(() => heardLog.length > beforeSign, 'صوت قاعدة العلامة');
  ok(lastHeard() === QURAN.rasm.signs[0].rule, 'نقرة البطاقة تُسمع قاعدتها (كلامنا نحن)');
  checkTargets('رسم المصحف');

  $('.next').click();
  await waitFor(() => $('.vchip--sign'), 'خطوة تمييز العلامة');
  for (let round = 1; round <= 3; round++) {
    await waitFor(() => $$('.vchip--sign').length === 3, `خيارات الجولة ${round}`);
    const shown = $('.mushaf--big').textContent.trim();
    const target = QURAN.rasm.signs.find((s) => s.read === shown);
    ok(!!target, `الجولة ${round}: الكلمة المعروضة «${shown}» من أمثلة الدرس`);
    const faces = texts('.vchip--sign .vchip-face');
    $$('.vchip--sign')[faces.indexOf(target.sign)].click();
    await sleep(900);
  }
  await waitFor(() => $('.celebrate'), 'ختام الرسم');
  ok(stored().stars['quran:rasm'] === 3, 'ونجوم الدرس محفوظة');

  // ————— ٥) الحروف المقطَّعة —————
  await seed(idsBefore('quran:muqattaat'));
  await goto('#/quran/muqattaat');
  await waitFor(() => $('.muq-card'), 'شاشة المقطَّعة');
  ok($$('.muq-card').length === QURAN.muqattaat.items.length,
    `${arNum(QURAN.muqattaat.items.length)} مجموعات حروف مقطَّعة`);
  ok(texts('.muq-head .mushaf').join('|') === QURAN.muqattaat.items.map((m) => m.read).join('|'),
    `وهي كما في المصحف (${texts('.muq-head .mushaf').join('، ')})`);
  const names = $$('.vchip--name');
  ok(names.length === QURAN.muqattaat.items.reduce((s, m) => s + m.parts.length, 0),
    `وأسماء حروفها أزرار (${names.length} اسماً)`);
  for (const chip of names) { chip.click(); await sleep(40); }
  ok(lastHeard() === 'نون', `نقرة الاسم تُسمعه (${lastHeard()})`);
  ok($('.lesson-body').textContent.includes(`قرأتَ ${arNum(4)}`),
    'وعدّاد المقروء يبلغ المجموعات كلها');
  $('.next').click();
  await waitFor(() => $('.celebrate'), 'ختام المقطَّعة');
  ok($$('.big-stars .on').length === 3, 'من قرأها كلها بأسمائها ⇒ ثلاث نجوم');

  // ————— ٥ب) محطة «كلمات السورة»: لا سورة قبل كلماتها (الحزمة ١٢) —————
  await seed(idsBefore(`quran:${surahWordsPart('s1')}`));
  await goto('#/quran/s1');
  ok(!!$('.station') && !$('.story'),
    'سورة الفاتحة مقفلة حتى تُتمّ كلماتُها — الدخول المباشر يعيده إلى الخريطة');
  ok(continueCard().textContent.includes('كلمات سورة'),
    `و«تابع من هنا» يشير إلى محطة الكلمات (${continueCard().textContent.trim().split('\n')[0]})`);

  await goto(`#/quran/${surahWordsPart('s1')}`);
  await waitFor(() => $('.sw-grid'), 'شاشة كلمات السورة');
  const swWords = surahWords(QURAN.surahs[0]);
  ok($$('.vchip--mushaf').length === swWords.length,
    `كلمات الفاتحة كلها بطاقاتٍ (${arNum(swWords.length)} كلمة بلا تكرار)`);
  ok(texts('.vchip--mushaf .vchip-face').join('|') === swWords.map((w) => w.text).join('|'),
    'ونصُّها من آياتها حرفاً بحرف وبترتيب ورودها');
  ok(!$$('.screen-card').some((c) => /[\u{1F300}-\u{1FAFF}]/u.test(c.textContent)),
    'ولا إيموجي في شاشة كلمات المصحف (DESIGN §٦)');

  const beforeWord = [heardLog.length, played.length, spoken.length];
  $$('.vchip--mushaf')[2].click();
  await sleep(120);
  ok(played.length === beforeWord[1] && spoken.length === beforeWord[2],
    'ونقرةُ الكلمة لا تمرّ بمولَّد ولا بنطق آلي — تلاوةُ قارئ أو صمت (METHOD §٥.٦)');
  ok($$('.vchip--mushaf')[2].classList.contains('good')
    && $('.lesson-body').textContent.includes(`سمعتَ ${arNum(1)}`),
    'والعدّاد يتبع ما قرأه الطفل من كلماتها');
  checkTargets('كلمات السورة');

  $('.next').click();
  await waitFor(() => $('.sw-ayah'), 'خطوة جِدْها في الآية');
  for (let round = 1; round <= 6; round++) {
    await waitFor(() => $('.sw-word'), `جولة ${round}`);
    const target = $('.sw-target').textContent.trim();
    const chips = $$('.sw-word');
    const line = chips.map((c) => c.textContent.trim()).join(' ');
    const ayah = QURAN.surahs[0].ayat.find((a) => a === line);
    if (round === 1) {
      const mark = heardLog.length;
      ok(!!ayah, `الجولة ١: الآية معروضة كاملةً حرفاً بحرف («${line.slice(0, 24)}…»)`);
      // ترتيبُ العرض عربيّ: أوّلُ كلمةٍ في الآية أيمنُ ما في سطرها
      const boxes = chips.map((c) => c.getBoundingClientRect());
      const firstRow = boxes.filter((b) => Math.abs(b.top - boxes[0].top) < 4);
      ok(firstRow.length > 1 && firstRow[0].left > firstRow.at(-1).left,
        `وتُقرأ من اليمين إلى اليسار (${firstRow.length} كلمة في السطر الأول)`);
      ok(chips.some((c) => c.textContent.trim() === target),
        `والكلمة المطلوبة «${target}» فيها`);
      ok(heardLog.length === mark,
        'ولا يُسمَع شيء قبل الاختيار — الحكم على القراءة لا على السمع');
      const wrong = chips.find((c) => c.textContent.trim() !== target);
      const before = [played.length, spoken.length];
      wrong.click();
      await sleep(150);
      ok(wrong.classList.contains('bad') && !!$('.sw-word'),
        'والخطأ يُعلَّم ولا ينقل إلى الجولة التالية');
      ok(played.length === before[0] && spoken.length === before[1],
        'ويُسمَع ما نقره هو بتلاوة القارئ لا بمولَّد (بلا تلقين)');
      await sleep(250);
    }
    $$('.sw-word').find((c) => c.textContent.trim() === target).click();
    await sleep(900);
  }
  await waitFor(() => $('.celebrate'), 'ختام كلمات السورة');
  ok($$('.big-stars .on').length === 2, `خطأ واحد ⇒ نجمتان (${$$('.big-stars .on').length})`);
  ok(stored().stars[`quran:${surahWordsPart('s1')}`] === 2, 'ونجومها محفوظة بمعرّف عقدتها');
  ok(Object.keys(stored().skills).length === 0, 'ولا قياس فيها (كسائر المرحلة القرآنية)');

  await goto('#/');
  await waitFor(() => $('.station--quran'), 'الخريطة');
  ok(continueCard().textContent.includes(`سورة ${QURAN.surahs[0].name}`),
    'وبإتمامها تُفتح سورتها — هذا هو الجسر');

  // ————— ٦) سورة الفاتحة: قراءة بالعين —————
  await seed(idsBefore('quran:s1'));
  await goto('#/quran/s1');
  await waitFor(() => $('.sheet--mushaf'), 'صفحة السورة');
  const fatiha = QURAN.surahs[0];
  ok($$('.ayah').length === fatiha.ayat.length, `آيات الفاتحة معروضة كلها (${$$('.ayah').length})`);
  ok(texts('.ayah .mushaf').join('|') === fatiha.ayat.join('|'),
    'ونصّها في الصفحة يطابق نصّ المنهج حرفاً بحرف');
  ok(!$('.basmala'), 'ولا بسملة مستقلة فيها — هي آيتها الأولى');
  ok($('.surah-title-text').textContent.includes(fatiha.name), `عنوانها: ${$('.surah-title-text').textContent}`);
  checkTargets('صفحة السورة');

  const heardBefore = heardLog.length;
  const ayat = $$('.ayah');
  for (const a of ayat) { a.click(); await sleep(30); }
  ok(heardLog.length === heardBefore,
    `ضغطُ الآية قراءةٌ بالعين لا سماع — لا صوت (سُمع ${heardLog.length - heardBefore})`);
  ok(ayat.every((a) => a.classList.contains('ayah--read')), 'والآية المقروءة تُعلَّم فيتتبّع موضعه');
  ok($('.foot .hint').textContent.includes(`قرأتَ ${arNum(7)}`),
    `وعدّاد المقروء يبلغ الآيات كلها (${$('.foot .hint').textContent})`);

  // ————— ٦ب) التلاوة بصوت القارئ: زرّ الآية وزرّ السورة —————
  ok($$('.ayah-listen').length === fatiha.ayat.length,
    `لكل آية زرّ تلاوة (${$$('.ayah-listen').length})`);
  ok(!$$('.screen-card').some((c) => /[\u{1F300}-\u{1FAFF}]/u.test(c.textContent)),
    'ولا إيموجي في شاشة السورة (DESIGN §٦) — الزرّ شكل هندسيّ');

  const beforeAyah = [recited.length, played.length, spoken.length];
  $$('.ayah-listen')[2].click();
  await waitFor(() => recited.length > beforeAyah[0], 'تلاوة الآية الثالثة');
  await sleep(60);
  ok(recited.at(-1) === fatiha.ayat[2],
    `زرّ الآية يتلوها بعينها من تسجيل القارئ (${recited.at(-1) === fatiha.ayat[2]})`);
  ok(played.length === beforeAyah[1] && spoken.length === beforeAyah[2],
    'ولا صوت مولَّد ولا نطق آلي معها البتّة');
  ok(!$$('.ayah').some((a, i) => i !== 2 && a.closest('.ayah-row').classList.contains('ayah-row--playing')),
    'والسطر المتلوّ وحده يُعلَّم — فيتبع الطفل موضعه بعينه');
  const beforeAll = recited.length;
  btn('اسمع السورة').click();
  await waitFor(() => recited.length >= beforeAll + fatiha.ayat.length, 'تلاوة السورة كاملة', 8000);
  ok(recited.slice(beforeAll, beforeAll + fatiha.ayat.length).join('|') === fatiha.ayat.join('|'),
    `و«اسمع السورة» يتلوها آيةً آية بالترتيب (${fatiha.ayat.length} آيات)`);
  await sleep(120);
  ok(!$('.ayah-row--playing'), 'وبانتهائها لا يبقى سطرٌ معلَّماً');
  ok(btn('اسمع السورة'), 'ويعود الزرّ إلى حاله');

  // ————— ٦ج) خطوةُ الترديد: يسمع الآية من القارئ ثم يردّدها — بلا مؤقّت —————
  //
  // خطوةٌ ثالثة في شاشة السورة لا عقدة (حكم المدير): لا تُقاس ولا تُقفَل بها سورة،
  // والانتقالُ فيها بيد الطفل وحدها.

  $('.next').click();
  await waitFor(() => $('.tarteel'), 'خطوة الترديد');
  ok(!$('.sheet--mushaf') && $('.tarteel'),
    'أتممتُ القراءة ⇒ خطوةُ الترديد لا الاحتفال — يسمع ثم يردّد');
  ok($('.tarteel .mushaf--big').textContent === fatiha.ayat[0],
    'وتبدأ بأول سطرٍ من الصفحة (الفاتحة: بسملتُها آيتُها الأولى)');
  ok(!$('.tarteel').textContent.match(/ثانية|ثوانٍ|:\d\d/),
    'ولا مؤقّتَ ولا عدّادَ وقتٍ في الشاشة (DESIGN §٥.٦)');
  checkTargets('خطوة الترديد');

  const beforeTarteel = [recited.length, played.length, spoken.length];
  btn('اسمع الآية').click();
  await waitFor(() => recited.length > beforeTarteel[0], 'تلاوة آية الترديد');
  await sleep(60);
  ok(recited.at(-1) === fatiha.ayat[0], 'وزرُّ السماع يتلو الآية المعروضة بصوت القارئ');
  ok(played.length === beforeTarteel[1] && spoken.length === beforeTarteel[2],
    'ولا صوتَ مولَّداً ولا نطقاً آلياً في الترديد البتّة');

  btn('التالية').click();
  await sleep(80);
  ok($('.tarteel .mushaf--big').textContent === fatiha.ayat[1],
    'و«التالية» تنقله بيده إلى الآية التي بعدها — لا انتقالَ آليّ');
  btn('السابقة').click();
  await sleep(80);
  ok($('.tarteel .mushaf--big').textContent === fatiha.ayat[0], 'و«السابقة» تردّه إليها');

  const backBtn = btn('عُد إلى القراءة');
  ok(!!backBtn, 'وله بابُ رجوعٍ إلى صفحة السورة');
  backBtn.click();
  await waitFor(() => $('.sheet--mushaf'), 'الرجوع إلى الصفحة');
  ok($$('.ayah').length === fatiha.ayat.length, 'فيعود إلى آياتها كما كانت');

  $('.next').click();
  await waitFor(() => $('.tarteel'), 'الترديد ثانيةً');
  $('.next').click();
  await waitFor(() => $('.celebrate'), 'ختام السورة');
  ok($$('.big-stars .on').length === 3, 'من قرأ آياتها كلها ⇒ ثلاث نجوم');
  ok(stored().stars['quran:s1'] === 3, 'ونجومها محفوظة');

  // ————— ٧) سورة الناس: البسملة سطر مستقلّ، وختام الرحلة —————
  await seed(idsBefore('quran:s114'));
  await goto('#/quran/s114');
  await waitFor(() => $('.sheet--mushaf'), 'صفحة الناس');
  const nas = QURAN.surahs.find((s) => s.id === 's114');
  ok($('.basmala')?.textContent.trim() === QURAN.basmala,
    'البسملة سطر مستقلّ فوق سور ما بعد الفاتحة');
  ok(texts('.ayah .mushaf').join('|') === nas.ayat.join('|'), 'وآياتها تطابق المنهج حرفاً بحرف');
  ok($$('.ayah-listen').length === nas.ayat.length + 1,
    `ولها زرّ تلاوةٍ لكل آية وللبسملة (${$$('.ayah-listen').length})`);

  // «اسمع السورة» هنا يبدأ بالبسملة ثم الآيات — والسماع لا يُحسب قراءةً
  const beforeNas = recited.length;
  btn('اسمع السورة').click();
  await waitFor(() => recited.length >= beforeNas + nas.ayat.length + 1, 'تلاوة الناس', 8000);
  ok(recited.slice(beforeNas, beforeNas + nas.ayat.length + 1).join('|')
      === [QURAN.basmala, ...nas.ayat].join('|'),
    'وتلاوتها تبدأ بالبسملة ثم آياتها بالترتيب');
  await sleep(120);
  ok($('.foot .hint').textContent.includes(`قرأتَ ${arNum(0)}`),
    `والسماع لا يُحسب قراءةً — النجوم للقراءة بالعين (${$('.foot .hint').textContent})`);

  for (const a of $$('.ayah')) { a.click(); await sleep(20); }
  $('.next').click();
  await waitFor(() => $('.tarteel'), 'ترديد الناس');
  ok($('.tarteel .mushaf--big').textContent === QURAN.basmala,
    'وترديدُ ما بعد الفاتحة يبدأ بالبسملة سطراً مستقلاً كما في الصفحة');
  $('.next').click();
  await waitFor(() => $('.celebrate'), 'ختام الناس');
  ok(!$('.celebrate').textContent.includes('أتممتَ الرحلة'),
    'وبعد الناس تبقى سورٌ وبساتين — فلا يُبشَّر باكتمال الرحلة قبل أوانه');

  $('.celebrate .btn--primary').click();
  await waitFor(() => $('.station'), 'العودة للخريطة');
  ok(continueCard()?.textContent.includes('كلمات سورة'),
    `والخريطة تدلّه على كلمات السورة التالية لا على سورتها (${continueCard()?.textContent.trim().split('\n')[0]})`);

  // ————— ٧ب) الشريحة الثانية: القفل التسلسليّ يمتدّ إليها، وآخرُها بابُ البساتين —————
  //
  // ثماني سورٍ أقرّها المدير بترتيب الطول (`docs/REVIEW_QURAN_SLICE.md`): لكلٍّ
  // محطةُ كلماتها ثم سورتُها، و«لا سورة قبل كلماتها» يسري عليها كما سرى على الأربع.

  const SLICE = ['s108', 's103', 's106', 's111', 's105', 's94', 's107', 's101'];
  const last = QURAN.surahs.at(-1);
  ok(last.id === 's101' && QURAN.surahs.length === 12,
    `اثنتا عشرة سورة، وآخرُها ${last.name} (${last.ayat.length} آية)`);

  await seed(idsBefore(`quran:${surahWordsPart('s108')}`));
  await goto('#/quran/s108');
  await sleep(200);
  ok(!$('.sheet--mushaf'), 'أوّلُ سور الشريحة مقفلةٌ حتى تُتمّ كلماتُها — القفل امتدّ إليها');

  await seed(idsBefore(`quran:${last.id}`));
  await goto(`#/quran/${last.id}`);
  await waitFor(() => $('.sheet--mushaf'), `صفحة ${last.name}`);
  ok(texts('.ayah .mushaf').join('|') === last.ayat.join('|'),
    `وآيات ${last.name} تطابق المصدر حرفاً بحرف على الشاشة (${last.ayat.length} آية)`);
  ok(!$$('.screen-card').some((c) => /[\u{1F300}-\u{1FAFF}]/u.test(c.textContent)),
    'ولا إيموجي في شاشتها (DESIGN §٦)');

  for (const a of $$('.ayah')) { a.click(); await sleep(15); }
  $('.next').click();
  await waitFor(() => $('.tarteel'), `ترديد ${last.name}`);
  $('.next').click();
  await waitFor(() => $('.celebrate'), `ختام ${last.name}`);
  ok(!$('.celebrate').textContent.includes('أتممتَ الرحلة'),
    'وبعد آخر سورة تبقى البساتين — فلا يُبشَّر باكتمال الرحلة قبل أوانه');

  $('.celebrate .btn--primary').click();
  await waitFor(() => $('.station'), 'العودة للخريطة');
  // (الحزمة ١٤) بين المصحف والبساتين بوابةُ إتقانٍ ثانية — فهي وجهتُه لا أول باقة
  ok(continueCard()?.textContent.includes('بوابة الحديقة'),
    `والخريطة تدلّه على بوابة الحديقة بعد آخر سورة (${continueCard()?.textContent.trim().split('\n')[0]})`);

  // ————— ٨) نصّ المصحف: يُتلى من تسجيل القارئ ولا يُولَّد صوتُه أبداً —————
  const mushaf = new Set(quranMushafTexts());
  const generated = played.filter((t) => mushaf.has(t));
  ok(generated.length === 0,
    `لم يُشغَّل لنصّ مصحفٍ صوتٌ مولَّد ولا مرة (${played.length} تشغيلاً مولَّداً في المرحلة)`
    + `${generated.length ? ' — ' + generated.join('، ') : ''}`);
  const synthesized = spoken.filter((t) => mushaf.has(t));
  ok(synthesized.length === 0,
    `ولا نُطق نصّ مصحفٍ نطقاً آلياً ولا مرة (${spoken.length} نصاً منطوقاً آلياً)`
    + `${synthesized.length ? ' — ' + synthesized.join('، ') : ''}`);
  ok(recited.length > 0 && recited.every((t) => mushaf.has(t)),
    `وما تُلي من تسجيل القارئ كلُّه نصّ مصحف (${recited.length} تلاوة)`);
  const missing = played.filter((t) => t.startsWith('?'));
  ok(missing.length === 0, `وكل ما شُغِّل من الملفات له ملف مولَّد (${played.length} تشغيلاً)`);
  const stray = spoken.filter((t) => !pendingAudio.has(t));
  ok(stray.length === 0,
    `والنطق الآلي لم يُستعمل إلا لنصوص تنتظر التصريف (${spoken.length} نصاً)`
    + `${stray.length ? ' — خارج القائمة: ' + stray.join('، ') : ''}`);
  ok(spoken.concat(played).every((t) => quranSpokenTexts().includes(t) || !mushaf.has(t)),
    'وما وُلِّد صوتُه كلّه من المأذون فيه');

  // وكلماتُ السورة مفردةً: نصُّ مصحفٍ كالآية — لا مولَّد ولا نطقاً آلياً (الحزمة ١٢)
  const surahTexts = new Set(quranWordTexts());
  const wordGenerated = played.filter((t) => surahTexts.has(t));
  const wordSpoken = spoken.filter((t) => surahTexts.has(t));
  ok(wordGenerated.length === 0 && wordSpoken.length === 0,
    `ولا كلمةَ سورةٍ (${surahTexts.size}) مرّت على مولَّد ولا على نطق آلي`
    + `${wordGenerated.concat(wordSpoken).length ? ' — ' + wordGenerated.concat(wordSpoken).join('، ') : ''}`);
  const strayWord = recitedWords.filter((t) => !surahTexts.has(t) && !t.startsWith('?'));
  ok(strayWord.length === 0,
    `وما طُلب من تلاوات الكلمة كلُّه من كلمات السور (${recitedWords.length} طلباً`
    + `${recitedWords.filter((t) => t.startsWith('?')).length ? '، بلا ملفٍ بعدُ' : ''})`);

  // ————— ٩) العمل دون إنترنت: عامل الخدمة يُسجَّل ويخزن —————
  const reg = await waitFor(async () => {
    const regs = await win.navigator.serviceWorker.getRegistrations();
    return regs.length ? regs[0] : null;
  }, 'تسجيل عامل الخدمة', 15000);
  ok(!!reg, `عامل الخدمة مسجَّل (${new URL(reg.scope).pathname})`);
  const sw = reg.active || reg.installing || reg.waiting;
  ok(!!sw, 'وهو قيد التنصيب أو نشط');
  const cacheNames = await waitFor(async () => {
    const names = await win.caches.keys();
    return names.some((n) => n.startsWith('muallim-shell')) ? names : null;
  }, 'مخزون الهيكل', 20000);
  ok(cacheNames.some((n) => n.startsWith('muallim-shell')),
    `ومخزون الهيكل مُنشأ (${cacheNames.join('، ')})`);
  const shellCache = await win.caches.open(cacheNames.find((n) => n.startsWith('muallim-shell')));
  const keys = await shellCache.keys();
  const paths = keys.map((r) => new URL(r.url).pathname);
  ok(paths.some((p) => p.endsWith('/js/quran.js')) && paths.some((p) => p.endsWith('/css/app.css')),
    `والملفات مخزونة فعلاً (${paths.length} ملفاً في المخزون)`);
  const cached = await shellCache.match(new URL('js/curriculum.js', win.location.href));
  ok(!!cached && (await cached.text()).includes('QURAN'),
    'ومحتواها صالح للقراءة من المخزون دون شبكة');
  ok(paths.some((p) => p.endsWith('/data/recitations.json')),
    'وبيانُ التلاوة في مخزون الهيكل');

  const audioName = (await win.caches.keys()).find((n) => n.startsWith('muallim-audio'));
  const audioCache = audioName && await win.caches.open(audioName);
  const audioKeys = audioCache ? await audioCache.keys() : [];
  const cachedAudio = new Set(audioKeys.map((r) => new URL(r.url).pathname.split('/').pop()));
  const offline = Object.keys(recitations.ayat).filter((k) => cachedAudio.has(`${k}.mp3`));
  ok(offline.length === Object.keys(recitations.ayat).length,
    `وتلاواتُ القارئ كلها مخزونة فتعمل دون إنترنت (${offline.length}/`
    + `${Object.keys(recitations.ayat).length} في ${audioName})`);
  // وسمُ بصمة المحتوى: بلا وسمٍ يبقى الجهاز على صوتٍ قديم أبداً بعد أي استبدال
  const untagged = audioKeys.filter((r) => !new URL(r.url).search.startsWith('?v='));
  ok(audioKeys.length > 0 && untagged.length === 0,
    `وكلُّ مخزونٍ صوتيّ بوسم بصمة محتواه (${audioKeys.length} ملفاً`
    + `${untagged.length ? '، بلا وسم: ' + untagged.length : ''}) — فاستبدالُ ملفٍ يكسر كاشَه وحده`);

  // ————— ١٠) التلاوة نفسها: ملفٌّ حقيقيّ يفكّه Chrome (لا مشغّل مزيّف) —————
  // القسم السابق يفحص الوصل بمشغّل مزيَّف؛ وهذا يفحص المادة: كل تلاوةٍ تُفكّ فعلاً
  // ولها مدّة معقولة — فلا يمرّ ملفٌ مبتور أو صفحةُ خطأ باسم mp3.
  const durations = await Promise.all(Object.keys(recitations.ayat).map((key) =>
    new Promise((resolve) => {
      const el = new Audio(`audio/${key}.mp3`);   // Audio الحقيقي (خارج الإطار)
      el.preload = 'metadata';
      el.addEventListener('loadedmetadata', () => resolve(el.duration), { once: true });
      el.addEventListener('error', () => resolve(0), { once: true });
      setTimeout(() => resolve(-1), 15000);
    })));
  const broken = durations.filter((d) => !(d > 1));
  ok(broken.length === 0,
    `كل تلاوة تُفكّ في متصفّح حقيقي بمدّة معقولة (${durations.length} ملفاً، `
    + `${Math.min(...durations).toFixed(1)}–${Math.max(...durations).toFixed(1)} ثانية)`
    + `${broken.length ? ' — معطوب: ' + broken.length : ''}`);

  ok(jsErrors.length === 0, `لا أخطاء جافاسكربت (${jsErrors.join(' | ') || 'لا شيء'})`);
} catch (e) {
  ok(false, 'استثناء: ' + ((e && e.stack) || e));
}

await fetch('/result', { method: 'POST', body: JSON.stringify(results, null, 1) });
</script>
</body>
</html>
